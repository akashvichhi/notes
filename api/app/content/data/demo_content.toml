# What the editor can do

Text can be **bold**, *italic*, <u>underlined</u>, ~~struck through~~ or <mark>highlighted</mark>, and [links](https://example.com) work too.

## Lists

- Bullet lists
  - with nested items
- [ ] Task lists you can tick off

## Code

```python
def greet(name: str) -> str:
    return f"Hello, {name}!"
```

## Tables

| Shortcut | Action |
|---|---|
| Ctrl+B | Bold |
| Ctrl+I | Italic |
| Ctrl+K | Search notes |

The editor counts words and characters as you type.
'''

