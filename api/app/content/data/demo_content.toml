# The demo account's sample content, restored every night by scripts/reset_demo.py
# (decision 14). Notes are Markdown, converted with the same converter as the MCP tools;
# the note list shows them in this order. Describe only what the app really does.

folders = ["Ideas", "Personal", "Work"]

[[notes]]
starred = true
tags = ["Getting started"]
markdown = '''
# Welcome to the demo

This account is **shared**: everyone who signs in as the demo sees the same notes. Change anything you like. Every night at 23:20 India time the account goes back to these sample notes, so the next visitor starts fresh.

Things to try:

- [ ] Open a folder in the sidebar, or create one of your own
- [ ] Add a tag to a note, then open the tag to see every note that has it
- [ ] Star a note so it shows up under **Starred**
- [ ] Press **Ctrl+K** and search all notes
- [ ] Delete a note, then restore it from the **Trash**

Please don't keep anything private here: other visitors can read it until the next reset.
'''

