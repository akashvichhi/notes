[[notes]]
title = "Masala chai"
folder = "Personal"
starred = true
tags = ["recipes"]
markdown = '''
Serves 2. About 10 minutes.

## Ingredients

- 1 cup water, 1 cup milk
- 2 tsp loose black tea
- 2 tsp sugar, or to taste
- 1 inch ginger, crushed
- 3 green cardamom pods, 2 cloves, a small piece of cinnamon

## Method

1. Boil the water with the ginger and spices for 2 minutes.
2. Add the tea and simmer for 1 minute.
3. Add the milk and sugar; bring to a boil twice.
4. Strain and serve hot.

*Tip:* crush the cardamom just before using it. The flavour fades fast.
'''

