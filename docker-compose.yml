# The app on one machine (decision 10). `docker compose up -d --build` builds and starts
# everything; the values come from the root .env (.env.example).

x-api: &api
  image: notes-app
  # Built from this repo, never pulled from a registry.
  pull_policy: build
  build:
    context: .
    dockerfile: docker/api/Dockerfile
  env_file: api/.env.production
  environment:
    # Here, not in api/.env.production, so the password and the domain live only in the
    # root .env.
    ALLOWED_ORIGINS: ${APP_ORIGIN:?set APP_ORIGIN in .env}
    DATABASE_URL: postgresql+psycopg://notes:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/notes
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  scheduler:
    <<: *api
    command: ["sh", "scripts/prune_daily.sh"]
    depends_on:
      # The app runs the migrations on start; the scheduler waits for them.
      app:
        condition: service_healthy

  web:
    image: caddy:2.11.6-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8000}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

  postgres:
    image: postgres:18.4-bookworm
    container_name: notes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: notes
      POSTGRES_DB: notes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Bound to localhost only, so the database is never reachable from outside the
    # machine; the app reaches it over Docker's own network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep the data in a versioned folder under this path.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/create_test_database.sql:/docker-entrypoint-initdb.d/create_test_database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
