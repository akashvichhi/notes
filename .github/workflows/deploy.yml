# Every push to master runs the checks, then deploys to the VPS (decision 6).
name: Deploy

on:
  push:
    branches: [master]

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  web-checks:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      # ESLint and Stylelint run with --fix, so a fix they had to make means
      # the pushed code wasn't clean.
      - name: Fail if the linters changed files
        run: git diff --exit-code

  api-checks:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    # The tests need a real Postgres: the ICU collation and full-text search have no
    # in-memory stand-in (api/CLAUDE.md).
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: notes
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: notes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notes -d notes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://notes:secret@127.0.0.1:5432/notes_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.13.6
          python-version: 3.14.3
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --frozen
      - run: make check
      # ruff runs with --fix and formats, so a change it had to make means the pushed
      # code wasn't clean.
      - name: Fail if the linters changed files
        run: git diff --exit-code

  deploy:
    needs: [web-checks, api-checks]
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # --ff-only stops the deploy if files were edited on the server,
          # instead of merging over them.
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$TARGET" \
            "cd '$APP_DIR' && git pull --ff-only origin master \
             && docker compose up -d --build --remove-orphans \
             && docker image prune -f"
